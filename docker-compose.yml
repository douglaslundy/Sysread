services:
  mongo:
    image: mongo:4.4
    cpus: 1.0
    mem_limit: 768m
    mem_reservation: 128m
    pids_limit: 256
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  web:
    build: .
    cpus: 1.0
    mem_limit: 768m
    mem_reservation: 128m
    pids_limit: 128
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/readcoach
    ports:
      - "${READCOACH_PORT:-3000}:3000"
    volumes:
      - uploads-data:/app/.data/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
  worker:
    build: .
    cpus: 1.0
    mem_limit: 768m
    mem_reservation: 128m
    pids_limit: 256
    restart: unless-stopped
    command: ["node_modules/.bin/tsx", "scripts/job-worker.ts"]
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/readcoach
    volumes:
      - uploads-data:/app/.data/uploads
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo-data:
  uploads-data:
